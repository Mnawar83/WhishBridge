name: Public docs safety
on:
  push:
  pull_request:
jobs:
  review-public-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm documentation-only contents
        run: python3 scripts/check_public_release.py
